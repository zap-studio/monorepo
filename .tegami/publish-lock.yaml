core:changelogs:
  - content:
      "---\npackages:\n  \"@zap-studio/fetch\":\n    type: patch\n---\n\n## Migrate to ultracite lint/format\n\nInternal formatting and lint cleanup only. No public API or behavior change.\n"
    filename: fetch-lint-format.md
    v: 0.0.0
  - content:
      "---\npackages:\n  \"@zap-studio/retry\":\n    type: patch\n---\n\n## Migrate to ultracite lint/format\n\nInternal formatting and lint cleanup only. No public API or behavior change.\n"
    filename: retry-lint-format.md
    v: 0.0.0
  - content:
      "---\npackages:\n  \"@zap-studio/validation\":\n    type: patch\n---\n\n## Migrate to ultracite lint/format\n\nInternal formatting and lint cleanup with no public API change. `isStandardSchema`\nnow accepts an optional argument, and `standardValidateSync` throws a `TypeError`\n(still an `Error`) for async schemas.\n"
    filename: validation-lint-format.md
    v: 0.0.0
  - content:
      "---\npackages:\n  \"@zap-studio/webhooks\":\n    type: minor\n---\n\n## Migrate to ultracite lint/format; make the adapter contract generic\n\n`Adapter` and `BaseAdapter` are now generic over the framework request/response\ntypes (`Adapter<TReq, TRes>`, `BaseAdapter<TReq, TRes>`), replacing the previous\nper-method generics. The mapping members (`toNormalizedRequest`,\n`toFrameworkResponse`, `handleWebhook`) are now arrow properties, so custom\nadapters must override them with property syntax rather than method syntax.\n\nAlso: `register()` now returns `this`, error hooks always receive a real `Error`\ninstance, and `rawBody` is typed as `Uint8Array`.\n"
    filename: webhooks-adapter-generics.md
    v: 0.0.0
  - content:
      "---\npackages:\n  \"@zap-studio/permit\":\n    type: patch\n---\n\n## Migrate to ultracite lint/format\n\nInternal formatting and lint cleanup only. No public API or behavior change.\n"
    filename: permit-lint-format.md
    v: 0.0.0
