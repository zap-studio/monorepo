pre-commit:
  parallel: true
  jobs:
    - name: lint
      run: pnpm exec oxlint --fix --type-aware --type-check --no-error-on-unmatched-pattern {staged_files}
      glob:
        - "**/*.js"
        - "**/*.jsx"
        - "**/*.ts"
        - "**/*.tsx"
      stage_fixed: true
    - name: format
      run: pnpm exec oxfmt {staged_files}
      glob:
        - "**/*.js"
        - "**/*.jsx"
        - "**/*.ts"
        - "**/*.tsx"
        - "**/*.json"
        - "**/*.jsonc"
        - "**/*.css"
      stage_fixed: true
