name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-packages:
    name: Build Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm
      - name: Build packages
        run: pnpm --filter "./packages/*" run build

  build-docs:
    name: Build Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm
      - name: Build docs
        run: pnpm --filter docs run build

  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm
      - name: Build packages
        run: pnpm --filter "./packages/*" run build
      - name: Run check
        run: pnpm run check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm
      - name: Build packages
        run: pnpm --filter "./packages/*" run build
      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Run tests
        run: pnpm run test

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm
      - name: Build packages
        run: pnpm --filter "./packages/*" run build
      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Run coverage
        run: CI=1 pnpm run test:coverage
      - name: Upload test results to Codecov
        if: ${{ always() }}
        uses: codecov/codecov-action@v7
        with:
          disable_search: true
          files: ./coverage/junit.xml
          fail_ci_if_error: false
          report_type: test_results
          use_oidc: true
          verbose: true
      - name: Upload coverage to Codecov
        if: ${{ always() }}
        uses: codecov/codecov-action@v7
        with:
          disable_search: true
          files: ./coverage/lcov.info
          fail_ci_if_error: false
          use_oidc: true
          verbose: true

  publish-check:
    name: Publish Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm
      - name: Build packages
        run: pnpm --filter "./packages/*" run build
      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Run publish checks
        run: pnpm run check && pnpm run test && pnpm --filter "./packages/*" run prepublishOnly
