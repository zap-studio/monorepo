name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    name: Analysis
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm
      - name: Fetch base branch
        run: git fetch origin "$BASE_REF"
      - name: Run fallow audit
        run: pnpm exec fallow audit --base "origin/$BASE_REF"
      - name: Run react-doctor
        run: pnpm exec react-doctor . --scope changed --base "origin/$BASE_REF" --blocking error

  build-docs:
    name: Build Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm
      - name: Build docs
        run: pnpm --filter docs run build
      - name: Type-check docs pages
        run: pnpm --filter docs run check
      - name: Validate docs links
        run: pnpm --filter docs run validate
      - name: Audit docs
        run: pnpm --filter docs run audit

  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm
      - name: Build packages
        run: pnpm run build
      - name: Run format check
        run: pnpm run format:check
      - name: Run typecheck
        run: pnpm run typecheck
      - name: Run lint
        run: pnpm run lint
      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Run tests
        run: pnpm run test

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm
      - name: Build packages
        run: pnpm run build
      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Run coverage
        run: CI=1 pnpm run test:coverage
      - name: Upload test results to Codecov
        if: ${{ always() }}
        uses: codecov/codecov-action@v7
        with:
          disable_search: true
          files: ./coverage/junit.xml
          report_type: test_results
          use_oidc: true
          verbose: true
      - name: Upload coverage to Codecov
        if: ${{ always() }}
        uses: codecov/codecov-action@v7
        with:
          disable_search: true
          files: ./coverage/lcov.info
          use_oidc: true
          verbose: true
