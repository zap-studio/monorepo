name: Setup pnpm

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v6

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: "lts/*"
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm ci
