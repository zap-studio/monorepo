# Docs-as-tests for the zap.ts documentation.
#
# An agent answers each question using ONLY the built docs. A question that
# fails names a page that is missing, wrong, or unfindable.
#
# Run: pnpm exec blume eval --threshold 0.9
# Fix: pnpm exec blume eval --fix
#
# Every question below is one a real user asks. Facts in `expected` must be
# verified against the zap.ts source before the page is written; see PLAN.md.

questions:
  # --- Evaluating the kit -------------------------------------------------
  - id: what-is-zap-ts
    question: What is zap.ts and what do I get when I clone it?
    expected:
      - A TypeScript SaaS starter kit built as a pnpm monorepo
      - Ships apps and reusable packages, not just a single app
    routes: ["/"]

  - id: which-framework
    question: Which frontend framework and router does zap.ts use?
    expected:
      - TanStack Start
      - TanStack Router
    routes: ["/tech-stack"]

  - id: which-database-layer
    question: What database and ORM does zap.ts use?
    expected:
      - PostgreSQL
      - Drizzle ORM
    routes: ["/tech-stack", "/packages/database"]

  - id: which-auth
    question: How is authentication implemented?
    expected:
      - Better Auth
      - Supports passkeys and API keys
    routes: ["/packages/authentication"]

  - id: license
    question: What licence is zap.ts released under and what does it allow?
    expected:
      - The licence terms are stated explicitly
    routes: ["/"]

  # --- Getting it running -------------------------------------------------
  - id: fresh-clone
    question: I just cloned the repo. What is the exact sequence to get a running app?
    expected:
      - pnpm install
      - docker compose up -d
      - 'pnpm run db:migrate'
      - 'pnpm run db:seed'
      - 'pnpm run dev:web'
    routes: ["/quickstart"]

  - id: third-party-accounts
    question: Do I need a Stripe or AWS account before the app runs locally?
    expected:
      - No third-party account is needed for a fresh clone
      - Postgres, Mailpit and MinIO come from Docker Compose
      - Billing runs in test mode
    routes: ["/quickstart", "/guides/local-development"]

  - id: where-does-mail-go
    question: Where do emails sent in local development end up?
    expected:
      - Mailpit
      - 'localhost:8025'
    routes: ["/guides/local-development", "/packages/mail"]

  - id: where-do-files-go
    question: Where are uploaded files stored in local development?
    expected:
      - MinIO
      - 'localhost:9001'
    routes: ["/guides/local-development", "/packages/storage"]

  - id: run-other-apps
    question: How do I start the marketing site, the admin back office and the docs?
    expected:
      - 'pnpm run dev:marketing'
      - 'pnpm run dev:admin'
      - 'pnpm run dev:docs'
    routes: ["/quickstart", "/project-structure"]

  # --- Structure ----------------------------------------------------------
  - id: what-are-the-apps
    question: What are the apps in the monorepo and what domain does each serve?
    expected:
      - 'web runs behind sign-in on app.<domain>'
      - 'marketing is the public site on <domain>'
      - 'admin is the back office on admin.<domain>'
    routes: ["/project-structure", "/apps/web", "/apps/marketing", "/apps/admin"]

  - id: admin-session
    question: Does an admin signed into the web app stay signed in on the admin app?
    expected:
      - No, admin holds its own session
      - An admin signs in again on the admin app
    routes: ["/apps/admin"]

  - id: workspace-globs
    question: Which directories does the pnpm workspace include?
    expected:
      - 'apps/*'
      - 'packages/*'
      - 'tooling/*'
    routes: ["/project-structure"]

  # --- Conventions --------------------------------------------------------
  - id: add-a-dependency
    question: How do I add a dependency from npm to a package in this monorepo?
    expected:
      - Add the version to the catalog in pnpm-workspace.yaml
      - 'Write "name": "catalog:" in the package.json'
      - Never write a version number in a package.json
    routes: ["/guides/dependencies"]

  - id: internal-dependency
    question: How does one package in the repo depend on another?
    expected:
      - 'workspace:*'
    routes: ["/guides/dependencies"]

  - id: env-vars
    question: How are environment variables declared and typed?
    expected:
      - varlock
      - Each app declares its variables in a .env.schema
      - The schema generates a typed ENV that the code imports
    routes: ["/guides/environment", "/packages/environment"]

  - id: no-env-local
    question: Do I need a .env.local file to start?
    expected:
      - Not until a service points at a real account
    routes: ["/guides/environment", "/quickstart"]

  # --- Testing ------------------------------------------------------------
  - id: test-naming
    question: How do I name a test file and where does it go?
    expected:
      - Next to the code it tests
      - 'Named *.node.test.ts or *.browser.test.ts'
    routes: ["/guides/testing"]

  - id: test-with-database
    question: How do I write a test that needs Postgres?
    expected:
      - createTestDatabase from the testing tooling package
      - Starts a PGlite database with the migrations applied
    routes: ["/guides/testing"]

  - id: no-mocking
    question: Can I mock modules in tests?
    expected:
      - No, the lint rules block module mocking
      - Pass the dependency in, or write a small fake of the real interface
    routes: ["/guides/testing", "/concepts/conventions"]

  - id: e2e
    question: How does the end-to-end test run and what does it need?
    expected:
      - Playwright, not Vitest
      - Needs a Postgres in TEST_DATABASE_URL
    routes: ["/guides/testing"]

  - id: which-checks
    question: What commands should I run before opening a pull request?
    expected:
      - pnpm run typecheck
      - pnpm run lint
      - 'pnpm run format:check'
      - pnpm run test
      - pnpm run build
    routes: ["/concepts/conventions"]

  # --- Swapping providers -------------------------------------------------
  - id: billing-providers
    question: Which payment providers does zap.ts support out of the box?
    expected:
      - Stripe
      - Polar
      - More than one provider is supported
    routes: ["/packages/billing"]

  - id: swap-billing
    question: How do I switch from Stripe to a different payment provider?
    expected:
      - Concrete steps naming the files to change
    routes: ["/recipes/swap-a-provider", "/packages/billing"]

  - id: production-storage
    question: How do I point storage at a real S3 bucket instead of MinIO?
    expected:
      - Concrete environment variables to set
    routes: ["/packages/storage", "/guides/going-to-production"]

  - id: add-oauth
    question: How do I add a new OAuth provider such as GitHub?
    expected:
      - Concrete steps naming the auth configuration file
    routes: ["/recipes/custom-oauth-provider"]

  # --- Building on it -----------------------------------------------------
  - id: add-a-feature
    question: How do I add a new feature that goes from a database column through to the UI?
    expected:
      - Change the schema
      - Generate and run a migration
      - Expose it through the API app
      - Consume it in the web app
    routes: ["/recipes/add-a-feature"]

  - id: migrations
    question: How do I create and apply a database migration?
    expected:
      - 'pnpm run db:generate'
      - 'pnpm run db:migrate'
    routes: ["/packages/database"]

  - id: translations
    question: How do I add a translated string to the web app?
    expected:
      - Paraglide
      - The message is compiled by an i18n compile step
    routes: ["/guides/internationalization"]

  - id: background-jobs
    question: How do I run a background job, and what changes between Cloudflare and Vercel?
    expected:
      - The queues package defines the job
      - A separate adapter package per platform
    routes: ["/packages/queues"]

  - id: feature-flags
    question: How do I gate a feature behind a flag?
    expected:
      - The flags package
      - Backed by PostHog
    routes: ["/packages/flags"]

  # --- Shipping -----------------------------------------------------------
  - id: deploy
    question: How do I deploy the web app?
    expected:
      - 'pnpm run deploy:web'
      - Cloudflare Workers via wrangler
    routes: ["/guides/deployment"]

  - id: production-checklist
    question: What must I change before taking zap.ts to production?
    expected:
      - Replace the seeded data
      - Point services at real accounts
      - Switch billing out of test mode
    routes: ["/guides/going-to-production"]

  - id: error-monitoring
    question: How do I see errors from production?
    expected:
      - Sentry
      - The observability package
    routes: ["/packages/observability"]

  # --- Working with agents ------------------------------------------------
  - id: agents-file
    question: How do I make an AI coding agent follow this repo's conventions?
    expected:
      - AGENTS.md at the repository root
      - It states the checks, the test rules and the dependency rules
    routes: ["/guides/agents"]

  # --- When it breaks -----------------------------------------------------
  - id: db-connection-fails
    question: The app cannot connect to Postgres. What do I check?
    expected:
      - Docker Compose is running
      - The connection string matches the compose service
    routes: ["/troubleshooting"]
